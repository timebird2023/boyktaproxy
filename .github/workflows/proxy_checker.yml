name: Ooredoo Proxy Scraper & Checker

on:
  schedule:
    - cron: '*/20 * * * *' # يعمل كل 20 دقيقة بشكل آلي
  workflow_dispatch: # زر لتشغيله يدوياً متى شئت

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # ⚠️️ صلاحية الكتابة لتحديث الملف في المستودع تلقائياً
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Scraper and Send to Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_PAT: ${{ secrets.GITHUB_TOKEN }} # استخدام توكن جيت هب المدمج للرفع
        run: python check_and_send.py
